name: prices
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: prices
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-
      - name: Collect prices
        run: timeout 30m python radar.py --once || true
      - name: Export
        run: |
          python -c "import sqlite3;c=sqlite3.connect('radar.db');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
          mkdir -p _site
          python export.py . _site
          rm -f _site/leads.json
          touch _site/.nojekyll
          python -c "import json,sys;d=json.load(open('_site/prices.json',encoding='utf-8'));n=sum(1 for i in d['items'] if i['m']=='ir');ok=sum(1 for s in d['sources'] if s['ok']);print('iran items',n,'sources ok',ok,'of',len(d['sources']));sys.exit(0 if n>=300 else 1)"
      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
      - name: Mirror to data branch
        run: |
          cd _site
          git init -q -b data
          git add -A
          git -c user.name=prices -c user.email=prices@users.noreply.github.com commit -qm "prices"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/prices.json" > /dev/null || true
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/prices.yml/enable" || true
